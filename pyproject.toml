[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intel"
version = "0.1.0"
description = "AI Document Intelligence PoC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit[pdf]>=1.33.0",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
